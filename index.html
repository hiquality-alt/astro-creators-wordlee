
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astro's Creators Wordle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <button id="helpBtn">?</button>
    <h1>✦ ASTRO'S CREATORS WORDLE</h1>
    <button id="statsBtn">▥</button>
    <button id="themeBtn">☼</button>
  </header>

  <nav>
    <button id="dailyBtn" class="active">Daily</button>
    <button id="freeBtn">Free Play</button>
  </nav>

  <main>
    <div id="message"></div>
    <div id="board"></div>
    <div id="keyboard"></div>
    <p id="bottomNote">Guess the creator in 6 tries!</p>
  </main>

  <dialog id="helpDialog">
    <button class="close" data-close>×</button>
    <h2>How to play</h2>
    <p>Guess the creator in six tries.</p>
    <p>🟩 Green = correct letter and position.</p>
    <p>🟨 Yellow = correct letter, wrong position.</p>
    <p>⬛ Grey = letter isn't in the name.</p>
  </dialog>

  <dialog id="statsDialog">
    <button class="close" data-close>×</button>
    <h2>Statistics</h2>
    <div id="stats"></div>
  </dialog>

  <dialog id="resultDialog">
    <button class="close" data-close>×</button>
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
    <button id="shareBtn">Share result</button>
    <button id="nextBtn">Play again</button>
  </dialog>

  <dialog id="confirmDialog">
    <button class="close" data-close>×</button>
    <h2>Are you sure?</h2>
    <p>Are you sure this creator isn't on the list?</p>
    <button id="confirmYes">Yes, submit</button>
    <button id="confirmNo">No, go back</button>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
